name: Build POS Connect

# Déclencher manuellement OU automatiquement sur chaque tag "v*"
# Exemple : git tag v1.0.0 && git push origin v1.0.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      web_server_scheme:
        description: 'Schéma API pour le web (http | https)'
        required: false
        default: 'https'
      web_server_ip:
        description: 'Domaine ou IP de l''API pour le web'
        required: false
        default: 'pos.infini-software.cloud'
      web_server_port:
        description: 'Port API pour le web (443 pour https)'
        required: false
        default: '443'
      web_cloud_url:
        description: 'URL cloud complète pour le wizard web'
        required: false
        default: 'https://pos.infini-software.cloud'
  push:
    tags:
      - 'v*'

# Permissions nécessaires pour créer des GitHub Releases
permissions:
  contents: write

# ─── Variables globales ────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.44.2'

# ══════════════════════════════════════════════════════════════════════════════
#  BACKEND  —  Nuitka standalone
#  NB: les --include-package tiers ont été retirés.
#      Nuitka suit les imports automatiquement via --standalone.
#      Les packages chargés dynamiquement (pymysql, etc.) sont importés
#      explicitement dans server_main.py pour forcer leur inclusion.
# ══════════════════════════════════════════════════════════════════════════════

jobs:

  # ── Version partagée ────────────────────────────────────────────────────────
  # Un seul calcul pour tout le workflow — évite la duplication et garantit que
  # tous les jobs utilisent exactement la même version. build_number = numéro
  # de run GitHub (toujours croissant) : embarqué dans AppConstants.appBuildNumber
  # (constants.dart) par chaque job frontend-*, pour que la comparaison de
  # version côté client (VersionCheckService) ne puisse plus dériver du chiffre
  # saisi manuellement dans le panneau admin — voir "Numéro de build" là-bas,
  # qui doit correspondre à CE build_number pour cette release.
  determine-version:
    name: 🔢 Déterminer la version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ github.run_number }}
    steps:
      - id: v
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version || '1.0.0' }}" >> $GITHUB_OUTPUT
          fi

  # ── Windows ─────────────────────────────────────────────────────────────────
  backend-windows:
    name: 🖥 Backend — Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install --upgrade pip
          # uvloop est Unix uniquement — on le filtre avant d'installer
          Get-Content requirements.txt |
            Where-Object { $_ -notmatch '^uvloop' -and $_.Trim() -ne '' } |
            Set-Content requirements_win.txt
          pip install -r requirements_win.txt
          pip install nuitka ordered-set

      - name: Verify packages
        shell: pwsh
        run: |
          python -c "import fastapi, sqlalchemy, uvicorn, pydantic; print('OK')"

      - name: Compile avec Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --include-package=api `
            --include-package-data=api `
            --include-package=alembic `
            --include-package-data=alembic `
            --include-package=tzdata `
            --include-package-data=tzdata `
            --include-data-files=alembic.ini=alembic.ini `
            --include-data-files=api/alembic.ini=api/alembic.ini `
            --include-data-files=pos_server.ini.example=pos_server.ini.example `
            --include-data-dir=api/static=api/static `
            --include-data-dir=api/alembic=api/alembic `
            --output-dir=dist `
            --output-filename=posconnect-server `
            server_main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-windows
          path: dist/server_main.dist/

  # ── Linux ────────────────────────────────────────────────────────────────────
  backend-linux:
    name: 🐧 Backend — Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y gcc patchelf ccache

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set

      - name: Compile avec Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --include-package=api \
            --include-package-data=api \
            --include-package=alembic \
            --include-package-data=alembic \
            --include-package=tzdata \
            --include-package-data=tzdata \
            --include-data-files=alembic.ini=alembic.ini \
            --include-data-files=api/alembic.ini=api/alembic.ini \
            --include-data-files=pos_server.ini.example=pos_server.ini.example \
            --include-data-dir=api/static=api/static \
            --include-data-dir=api/alembic=api/alembic \
            --output-dir=dist \
            --output-filename=posconnect-server \
            server_main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: dist/server_main.dist/

  # ── macOS ────────────────────────────────────────────────────────────────────
  backend-macos:
    name:  Backend — macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set

      - name: Compile avec Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --include-package=api \
            --include-package-data=api \
            --include-package=alembic \
            --include-package-data=alembic \
            --include-package=tzdata \
            --include-package-data=tzdata \
            --include-data-files=alembic.ini=alembic.ini \
            --include-data-files=api/alembic.ini=api/alembic.ini \
            --include-data-files=pos_server.ini.example=pos_server.ini.example \
            --include-data-dir=api/static=api/static \
            --include-data-dir=api/alembic=api/alembic \
            --output-dir=dist \
            --output-filename=posconnect-server \
            server_main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-macos
          path: dist/server_main.dist/

# ══════════════════════════════════════════════════════════════════════════════
#  FRONTEND  —  Flutter build
# ══════════════════════════════════════════════════════════════════════════════

  # ── Windows ─────────────────────────────────────────────────────────────────
  frontend-windows:
    name: 🖥 Frontend — Windows
    runs-on: windows-latest
    needs: [determine-version]
    steps:
      - uses: actions/checkout@v4

      - name: Fixer la version/build de l'app (constants.dart)
        shell: bash
        run: |
          python3 <<'EOF'
          import re
          path = "frontend/lib/core/constants.dart"
          with open(path) as f:
              c = f.read()
          c = re.sub(r"appVersion\s*=\s*'[^']*'", "appVersion     = '${{ needs.determine-version.outputs.version }}'", c)
          c = re.sub(r"appBuildNumber\s*=\s*\d+", "appBuildNumber = ${{ needs.determine-version.outputs.build_number }}", c)
          with open(path, "w") as f:
              f.write(c)
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        working-directory: frontend
        run: flutter pub get

      - name: Build Windows
        working-directory: frontend
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-windows
          path: frontend/build/windows/x64/runner/Release/

  # ── Linux ────────────────────────────────────────────────────────────────────
  frontend-linux:
    name: 🐧 Frontend — Linux
    runs-on: ubuntu-22.04
    needs: [determine-version]
    steps:
      - uses: actions/checkout@v4

      - name: Fixer la version/build de l'app (constants.dart)
        run: |
          python3 <<'EOF'
          import re
          path = "frontend/lib/core/constants.dart"
          with open(path) as f:
              c = f.read()
          c = re.sub(r"appVersion\s*=\s*'[^']*'", "appVersion     = '${{ needs.determine-version.outputs.version }}'", c)
          c = re.sub(r"appBuildNumber\s*=\s*\d+", "appBuildNumber = ${{ needs.determine-version.outputs.build_number }}", c)
          with open(path, "w") as f:
              f.write(c)
          EOF

      - name: Dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install packages
        working-directory: frontend
        run: flutter pub get

      - name: Build Linux
        working-directory: frontend
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-linux
          path: frontend/build/linux/x64/release/bundle/

  # ── macOS ────────────────────────────────────────────────────────────────────
  frontend-macos:
    name:  Frontend — macOS
    runs-on: macos-14
    needs: [determine-version]
    steps:
      - uses: actions/checkout@v4

      - name: Fixer la version/build de l'app (constants.dart)
        run: |
          python3 <<'EOF'
          import re
          path = "frontend/lib/core/constants.dart"
          with open(path) as f:
              c = f.read()
          c = re.sub(r"appVersion\s*=\s*'[^']*'", "appVersion     = '${{ needs.determine-version.outputs.version }}'", c)
          c = re.sub(r"appBuildNumber\s*=\s*\d+", "appBuildNumber = ${{ needs.determine-version.outputs.build_number }}", c)
          with open(path, "w") as f:
              f.write(c)
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        working-directory: frontend
        run: flutter pub get

      - name: Build macOS
        working-directory: frontend
        # Signature désactivée : pas de profil Apple Developer sur le runner CI.
        # Le .app produit est non-signé (distribution directe, hors App Store).
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
        run: flutter build macos --release

      - name: Create archive
        run: |
          cd frontend/build/macos/Build/Products/Release
          ls -la   # debug: voir le vrai nom du .app
          APP=$(ls -d *.app 2>/dev/null | head -1)
          tar -czf posconnect-macos-app.tar.gz "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-macos
          path: frontend/build/macos/Build/Products/Release/posconnect-macos-app.tar.gz

  # ── Web ──────────────────────────────────────────────────────────────────────
  frontend-web:
    name: 🌐 Frontend — Web
    runs-on: ubuntu-latest
    needs: [determine-version]
    steps:
      - uses: actions/checkout@v4

      - name: Fixer la version/build de l'app (constants.dart)
        run: |
          python3 <<'EOF'
          import re
          path = "frontend/lib/core/constants.dart"
          with open(path) as f:
              c = f.read()
          c = re.sub(r"appVersion\s*=\s*'[^']*'", "appVersion     = '${{ needs.determine-version.outputs.version }}'", c)
          c = re.sub(r"appBuildNumber\s*=\s*\d+", "appBuildNumber = ${{ needs.determine-version.outputs.build_number }}", c)
          with open(path, "w") as f:
              f.write(c)
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        working-directory: frontend
        run: flutter pub get

      - name: Résoudre les paramètres serveur web
        id: web_params
        run: |
          # Priorité : workflow_dispatch inputs → secrets → valeurs par défaut
          SCHEME="${{ github.event.inputs.web_server_scheme || secrets.WEB_SERVER_SCHEME || 'https' }}"
          IP="${{ github.event.inputs.web_server_ip || secrets.WEB_SERVER_IP || 'api.posconnect.ht' }}"
          PORT="${{ github.event.inputs.web_server_port || secrets.WEB_SERVER_PORT || '443' }}"
          CLOUD="${{ github.event.inputs.web_cloud_url || secrets.WEB_CLOUD_URL || 'https://posconnect.ht' }}"
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "ip=$IP"         >> $GITHUB_OUTPUT
          echo "port=$PORT"     >> $GITHUB_OUTPUT
          echo "cloud=$CLOUD"   >> $GITHUB_OUTPUT

      - name: Build Web
        working-directory: frontend
        run: |
          flutter build web --release \
            --dart-define=SERVER_SCHEME=${{ steps.web_params.outputs.scheme }} \
            --dart-define=SERVER_IP=${{ steps.web_params.outputs.ip }} \
            --dart-define=SERVER_PORT=${{ steps.web_params.outputs.port }} \
            --dart-define=CLOUD_URL=${{ steps.web_params.outputs.cloud }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: frontend/build/web/

# ══════════════════════════════════════════════════════════════════════════════
#  INNO SETUP  —  Installeur Windows (.exe)
#
#  Dépendances téléchargées au moment du build :
#    - nginx 1.27.4   (nginx.org)
#    - nssm  2.24     (nssm.cc)
#  MySQL N'EST PAS bundlé — setup-windows.ps1 le télécharge à l'install
#  Certificats SSL :
#    - certificat/server.crt + server.key commités dans le repo (auto-signés)
# ══════════════════════════════════════════════════════════════════════════════

  inno-setup:
    name: 🏗 Windows Installer (Inno Setup)
    runs-on: windows-latest
    needs: [backend-windows, determine-version]
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger backend-windows artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-windows
          path: certificat/backend-windows/

      - name: Télécharger et extraire nginx 1.27.4
        shell: pwsh
        run: |
          $ver = "1.27.4"
          Invoke-WebRequest -Uri "https://nginx.org/download/nginx-$ver.zip" -OutFile "nginx.zip" -UseBasicParsing
          Expand-Archive "nginx.zip" -DestinationPath "certificat" -Force
          if (Test-Path "certificat\nginx") { Remove-Item "certificat\nginx" -Recurse -Force }
          Rename-Item "certificat\nginx-$ver" "nginx"

      - name: Télécharger et extraire NSSM 2.24
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile "nssm.zip" -UseBasicParsing
          Expand-Archive "nssm.zip" -DestinationPath "nssm-tmp" -Force
          New-Item -ItemType Directory -Force -Path "certificat\nssm" | Out-Null
          Copy-Item "nssm-tmp\nssm-2.24\win64\*" "certificat\nssm\" -Recurse -Force

      - name: Vérifier les certificats SSL
        shell: pwsh
        run: |
          # server.crt et server.key sont commités dans certificat/ (auto-signés, usage local)
          # ISCC les lira directement depuis certificat\ (chemin relatif au .iss)
          if (-not (Test-Path "certificat\server.crt") -or -not (Test-Path "certificat\server.key")) {
            throw "certificat\server.crt ou server.key introuvable — relancer 'certificat/generate.sh' et commiter les fichiers"
          }
          Write-Host "Certificats SSL présents ($(Get-Item 'certificat\server.crt' | Select-Object -ExpandProperty Length) octets)"

      - name: Compiler posconnect-manager.exe (ps2exe, sans console PowerShell)
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -Force -Scope CurrentUser -Repository PSGallery
          Import-Module ps2exe
          $ico = "certificat\setup-info\pos.ico"
          $params = @{
            inputFile    = "certificat\posconnect-manager.ps1"
            outputFile   = "certificat\posconnect-manager.exe"
            noConsole    = $true
            title        = "POS Connect Manager"
            description  = "Gestionnaire de service POS Connect"
            version      = "1.0.0.0"
            requireAdmin = $true
          }
          if (Test-Path $ico) { $params['iconFile'] = $ico }
          Invoke-ps2exe @params
          if (-not (Test-Path "certificat\posconnect-manager.exe")) {
            throw "posconnect-manager.exe non généré"
          }
          Write-Host "OK — posconnect-manager.exe compilé"

      - name: Compiler l'installeur Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver  = "${{ needs.determine-version.outputs.version }}"
          Write-Host "Compilation Inno Setup v$ver"
          & $iscc "/DMyAppVersion=$ver" "certificat\pos-server.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ISCC.exe a échoué (code $LASTEXITCODE)" }

      - name: Upload installeur Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: certificat/POSConnect-Setup-*.exe

# ══════════════════════════════════════════════════════════════════════════════
#  INNO CLIENT  —  Installeur Flutter Windows (.exe)
# ══════════════════════════════════════════════════════════════════════════════

  inno-client:
    name: 🖥 Client Installer (Inno Setup)
    runs-on: windows-latest
    needs: [frontend-windows, determine-version]
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger frontend-windows artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-windows
          path: certificat/frontend-windows/

      - name: Préparer la signature (certificat + script sign.cmd)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WIN_CODESIGN_PFX_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\posconnect-codesign.pfx", $bytes)

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe introuvable sur ce runner" }

          # sign.cmd encapsule toute la commande (avec ses guillemets internes
          # pour les chemins/mot de passe) DANS le fichier, pas dans un
          # argument de ligne de commande — évite le bug où & scindait
          # /SPosConnectSignTool=... contenant des guillemets imbriqués en
          # plusieurs arguments ("plus d'un nom de script" côté ISCC).
          #
          # Le mot de passe est lu via $env:PFX_PASSWORD (pas interpolé
          # directement dans une chaîne PowerShell "${{ secrets.X }}") car
          # s'il contient un caractère '$', PowerShell l'interpréterait comme
          # le début d'une référence de variable dans une chaîne entre
          # guillemets doubles et le tronquerait silencieusement — le mot de
          # passe transmis à signtool serait alors corrompu même si le
          # secret GitHub est correct (cause probable de "PFX password is
          # not correct" malgré un mot de passe vérifié comme exact).
          $pass = $env:PFX_PASSWORD

          # Diagnostic : ouvre le PFX avec ce mot de passe via .NET, sans
          # passer par signtool/sign.cmd/Inno — élimine toute cause liée au
          # fichier batch (quoting, encodage) et répond sans ambiguïté à la
          # question "ce mot de passe correspond-il à ce fichier PFX ?".
          Add-Type -AssemblyName System.Security
          try {
              $null = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                  "$env:RUNNER_TEMP\posconnect-codesign.pfx", $pass)
              Write-Host "Diagnostic PFX : mot de passe valide, certificat chargé avec succès."
          } catch {
              Write-Host "Diagnostic PFX : ÉCHEC du chargement — $($_.Exception.Message)"
              throw "Le mot de passe ne correspond pas au fichier PFX (vérifié hors signtool/Inno) — secrets WIN_CODESIGN_PFX_BASE64 / WIN_CODESIGN_PFX_PASSWORD désynchronisés."
          }

          # -Encoding ASCII remplacerait silencieusement par '?' tout
          # caractère non-ASCII du mot de passe s'il en contenait — UTF8
          # sans BOM préserve le mot de passe tel quel si jamais c'est le cas.
          @"
          @echo off
          "$signtool" sign /fd SHA256 /f "$env:RUNNER_TEMP\posconnect-codesign.pfx" /p "$pass" /tr http://timestamp.digicert.com /td SHA256 %1
          "@ | Set-Content -Path "$env:RUNNER_TEMP\sign.cmd" -Encoding UTF8NoBOM

      - name: Compiler l'installeur client Inno Setup (signé)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver  = "${{ needs.determine-version.outputs.version }}"
          Write-Host "Compilation + signature client Inno Setup v$ver"
          # /S value = chemin (sans espace, RUNNER_TEMP) + " $f" — un seul
          # espace, aucun guillemet imbriqué : passe correctement par & là où
          # la commande complète avec guillemets échouait auparavant.
          & $iscc "/DMyAppVersion=$ver" "/SPosConnectSignTool=$env:RUNNER_TEMP\sign.cmd `$f" "certificat\pos-client.iss"
          $exitCode = $LASTEXITCODE
          Remove-Item "$env:RUNNER_TEMP\sign.cmd" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP\posconnect-codesign.pfx" -Force -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { throw "Inno Setup ISCC.exe a échoué (code $exitCode)" }

      - name: Upload installeur client Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-installer
          path: certificat/POSConnect-Client-Setup-*.exe

# ══════════════════════════════════════════════════════════════════════════════
#  RELEASE  —  Assembler et publier
# ══════════════════════════════════════════════════════════════════════════════

  release:
    name: 📦 Créer la Release
    needs:
      - determine-version
      - backend-windows
      - backend-linux
      - backend-macos
      - frontend-windows
      - frontend-linux
      - frontend-macos
      - frontend-web
      - inno-setup
      - inno-client
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assembler Windows (zip backend+frontend)
        run: |
          mkdir -p packages/windows
          cp -r artifacts/backend-windows/* packages/windows/
          cp -r artifacts/frontend-windows/* packages/windows/
          cd packages
          zip -r posconnect-windows-${{ needs.determine-version.outputs.version }}.zip windows/

      - name: Copier installeur serveur Windows (.exe)
        run: |
          cp artifacts/windows-installer/POSConnect-Setup-*.exe packages/ 2>/dev/null || \
            echo "Avertissement : aucun EXE serveur Inno Setup trouvé"

      - name: Copier installeur client Windows (.exe)
        run: |
          cp artifacts/windows-client-installer/POSConnect-Client-Setup-*.exe packages/ 2>/dev/null || \
            echo "Avertissement : aucun EXE client Inno Setup trouvé"

      - name: Assembler Linux (tar.gz)
        run: |
          mkdir -p packages/linux
          cp -r artifacts/backend-linux/* packages/linux/
          cp -r artifacts/frontend-linux/* packages/linux/
          cd packages
          tar -czf posconnect-linux-${{ needs.determine-version.outputs.version }}.tar.gz linux/

      - name: Assembler macOS (tar.gz)
        run: |
          mkdir -p packages/macos
          cp -r artifacts/backend-macos/* packages/macos/
          cp artifacts/frontend-macos/posconnect-macos-app.tar.gz packages/macos/
          cd packages
          tar -czf posconnect-macos-${{ needs.determine-version.outputs.version }}.tar.gz macos/

      - name: Assembler Web (zip)
        run: |
          mkdir -p packages/web
          cp -r artifacts/frontend-web/* packages/web/
          cd packages
          zip -r posconnect-web-${{ needs.determine-version.outputs.version }}.zip web/

      - name: Afficher les tailles
        run: ls -lh packages/*.zip packages/*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: posconnect-v${{ needs.determine-version.outputs.version }}
          path: |
            packages/posconnect-windows-*.zip
            packages/POSConnect-Setup-*.exe
            packages/POSConnect-Client-Setup-*.exe
            packages/posconnect-linux-*.tar.gz
            packages/posconnect-macos-*.tar.gz
            packages/posconnect-web-*.zip
          retention-days: 30

      - name: Créer GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: POS Connect v${{ needs.determine-version.outputs.version }}
          body: |
            ## POS Connect v${{ needs.determine-version.outputs.version }}

            **Panneau admin → Mises à jour applicatives** : Dernière version
            `${{ needs.determine-version.outputs.version }}`, Numéro de build
            `${{ needs.determine-version.outputs.build_number }}`.

            | Plateforme | Fichier |
            |-----------|---------|
            | Windows — Serveur (installeur) | `POSConnect-Setup-${{ needs.determine-version.outputs.version }}.exe` |
            | Windows — Client (installeur)  | `POSConnect-Client-Setup-${{ needs.determine-version.outputs.version }}.exe` |
            | Windows — Zip (serveur+client) | `posconnect-windows-${{ needs.determine-version.outputs.version }}.zip` |
            | Linux                | `posconnect-linux-${{ needs.determine-version.outputs.version }}.tar.gz` |
            | macOS                | `posconnect-macos-${{ needs.determine-version.outputs.version }}.tar.gz` |
            | Web                  | `posconnect-web-${{ needs.determine-version.outputs.version }}.zip` |

            ### Installation Windows
            Télécharger et exécuter `POSConnect-Setup-*.exe` en tant qu'Administrateur.
            Installe dans `C:\ProgramData\POS_Connect\` (données MySQL dans `C:\ProgramData\POS_Connect_MySQL\`).

            ### Déploiement Web
            Extraire `posconnect-web-*.zip` dans le dossier `web/` à côté du serveur FastAPI,
            ou servir avec Nginx (voir documentation).
          files: |
            packages/posconnect-windows-*.zip
            packages/POSConnect-Setup-*.exe
            packages/POSConnect-Client-Setup-*.exe
            packages/posconnect-linux-*.tar.gz
            packages/posconnect-macos-*.tar.gz
            packages/posconnect-web-*.zip
          draft: false
          prerelease: false

      # Miroir public — thom721/pos reste privé (code source), seuls les
      # binaires compilés sont publiés sur infini-software/pos (repo public,
      # référencé par les liens de mise à jour du panneau admin). Nécessite
      # le secret INFINI_SOFTWARE_RELEASE_TOKEN (PAT avec accès en écriture
      # sur infini-software/pos) — non-bloquant tant qu'il n'est pas configuré.
      - name: Créer GitHub Release (miroir public infini-software/pos)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: infini-software/pos
          token: ${{ secrets.INFINI_SOFTWARE_RELEASE_TOKEN }}
          tag_name: v${{ needs.determine-version.outputs.version }}
          name: POS Connect v${{ needs.determine-version.outputs.version }}
          body: |
            ## POS Connect v${{ needs.determine-version.outputs.version }}

            **Panneau admin → Mises à jour applicatives** : Dernière version
            `${{ needs.determine-version.outputs.version }}`, Numéro de build
            `${{ needs.determine-version.outputs.build_number }}`.

            | Plateforme | Fichier |
            |-----------|---------|
            | Windows — Serveur (installeur) | `POSConnect-Setup-${{ needs.determine-version.outputs.version }}.exe` |
            | Windows — Client (installeur)  | `POSConnect-Client-Setup-${{ needs.determine-version.outputs.version }}.exe` |
            | Windows — Zip (serveur+client) | `posconnect-windows-${{ needs.determine-version.outputs.version }}.zip` |
            | Linux                | `posconnect-linux-${{ needs.determine-version.outputs.version }}.tar.gz` |
            | macOS                | `posconnect-macos-${{ needs.determine-version.outputs.version }}.tar.gz` |
            | Web                  | `posconnect-web-${{ needs.determine-version.outputs.version }}.zip` |
          files: |
            packages/posconnect-windows-*.zip
            packages/POSConnect-Setup-*.exe
            packages/POSConnect-Client-Setup-*.exe
            packages/posconnect-linux-*.tar.gz
            packages/posconnect-macos-*.tar.gz
            packages/posconnect-web-*.zip
          draft: false
          prerelease: false
